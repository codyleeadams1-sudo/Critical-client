name: Build Critical Client
 
on:
  push:
  pull_request:
  workflow_dispatch:   # lets you press "Run workflow" manually
 
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
 
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
 
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.2.0
 
      - name: Build
        run: gradle build --no-daemon
 
      - name: Collect jar
        run: |
          mkdir dist
          for f in build/libs/*.jar; do case "$f" in *sources*) ;; *) cp "$f" dist/ ;; esac; done
 
      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: criticalclient-jar
          path: dist/*.jar
